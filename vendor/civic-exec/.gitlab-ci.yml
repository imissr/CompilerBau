# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml


stages:          # List of stages for jobs, and their order of execution
  - build
  - release

build-binaries:       # This job runs in the build stage, which runs first.
  image: debian:stable
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "BUILD_JOB_BINARIES_ID=$CI_JOB_ID" >> build.env
    - echo "Compiling Assember and VM"
    - apt-get update
    - apt-get install -y curl build-essential
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup_install.sh
    - sh rustup_install.sh -y
    - . "$HOME/.cargo/env"
    - rustup toolchain install stable
  script:
    - cargo build --release
  artifacts:
    expire_in: 30 days
    paths:
      - target/release/civicas
      - target/release/civicvm
    reports:
      dotenv: build.env

build-docs:
  image: texlive/texlive
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "BUILD_JOB_DOCS_ID=$CI_JOB_ID" >> build.env
    - echo "Building docs"
  script:
    - cd doc
    - latexmk -pdf manual.tex
  artifacts:
    expire_in: 30 days
    paths:
      - doc/manual.pdf
    reports:
      dotenv: build.env

publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  only:
    - tags
  needs:
    - job: build-binaries
      artifacts: true
    - job: build-docs
      artifacts: true
  script:
    - echo $BUILD_JOB_BINARIES_ID
    - echo $BUILD_JOB_DOCS_ID
  release:
    tag_name: $CI_COMMIT_TAG
    description: $CI_COMMIT_TAG_MESSAGE
    assets:
      links:
        - name: "CiviC Assembler"
          url: ${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_BINARIES_ID}/artifacts/raw/target/release/civicas
        - name: "CiviC Virtual Machine"
          url: ${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_BINARIES_ID}/artifacts/raw/target/release/civicvm
        - name: "Handbook"
          url: ${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_DOCS_ID}/artifacts/raw/doc/manual.pdf
          
